apiVersion: 1

deleteRules:
  - { orgId: 1, uid: cons-running-out }
  - { orgId: 1, uid: cons-level-low }
  - { orgId: 1, uid: cons-expiring }
  - { orgId: 1, uid: cons-expired }
  - { orgId: 1, uid: printer-downtime }
  - { orgId: 1, uid: viscosity-drift }
  - { orgId: 1, uid: node-offline }

groups:
  - orgId: 1
    name: consommables
    folder: Imprimante
    interval: 1m
    rules:
      - uid: cons-running-out-influx
        title: Consommable bientôt épuisé
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, audience: maintenance }
        annotations:
          summary: >-
            {{ $labels.consumable_type }} sera épuisé dans environ
            {{ printf "%.1f" $values.B.Value }} heures
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                ink = from(bucket: "printer_monitoring")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "printer_telemetry" and r._field == "ink_hours_to_empty")
                  |> group(columns: ["printer_id"])
                  |> last()
                  |> set(key: "consumable_type", value: "Encre")
                solvent = from(bucket: "printer_monitoring")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "printer_telemetry" and r._field == "solvent_hours_to_empty")
                  |> group(columns: ["printer_id"])
                  |> last()
                  |> set(key: "consumable_type", value: "Solvant")
                union(tables: [ink, solvent])
                  |> group()
                  |> sort(columns: ["_value"])
                  |> limit(n: 1)
                  |> group(columns: ["printer_id", "consumable_type"])
                  |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value")
              datasource: { type: influxdb, uid: influxdb }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [8] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: cons-level-low-influx
        title: Niveau de consommable bas
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, audience: maintenance }
        annotations:
          summary: >-
            {{ $labels.consumable_type }} : niveau à
            {{ printf "%.0f" $values.B.Value }}%
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                ink = from(bucket: "printer_monitoring")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "printer_telemetry" and r._field == "ink_level")
                  |> group(columns: ["printer_id"])
                  |> last()
                  |> set(key: "consumable_type", value: "Encre")
                solvent = from(bucket: "printer_monitoring")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "printer_telemetry" and r._field == "solvent_level")
                  |> group(columns: ["printer_id"])
                  |> last()
                  |> set(key: "consumable_type", value: "Solvant")
                union(tables: [ink, solvent])
                  |> group()
                  |> sort(columns: ["_value"])
                  |> limit(n: 1)
                  |> group(columns: ["printer_id", "consumable_type"])
                  |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value")
              datasource: { type: influxdb, uid: influxdb }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [20] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: cons-expiring-influx
        title: Consommable proche de l’expiration
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, audience: maintenance }
        annotations:
          summary: >-
            Le lot de {{ $labels.consumable_type }} expire dans
            {{ printf "%.0f" $values.B.Value }} jours
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                base = from(bucket: "printer_monitoring")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "printer_telemetry" and (r._field == "ink_days_to_expiry" or r._field == "ink_expiry_limited" or r._field == "solvent_days_to_expiry" or r._field == "solvent_expiry_limited"))
                  |> group(columns: ["printer_id", "_field"])
                  |> last()
                  |> pivot(rowKey: ["printer_id"], columnKey: ["_field"], valueColumn: "_value")
                ink = base
                  |> filter(fn: (r) => r.ink_expiry_limited == 1.0 and r.ink_days_to_expiry >= 0.0)
                  |> map(fn: (r) => ({_time: now(), _value: r.ink_days_to_expiry, printer_id: r.printer_id, consumable_type: "Encre"}))
                solvent = base
                  |> filter(fn: (r) => r.solvent_expiry_limited == 1.0 and r.solvent_days_to_expiry >= 0.0)
                  |> map(fn: (r) => ({_time: now(), _value: r.solvent_days_to_expiry, printer_id: r.printer_id, consumable_type: "Solvant"}))
                union(tables: [ink, solvent])
                  |> group(columns: ["printer_id", "consumable_type"])
                  |> set(key: "_field", value: "days_to_expiry")
                  |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value")
              datasource: { type: influxdb, uid: influxdb }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: lt, params: [14] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: cons-expired-influx
        title: Consommable expiré
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical, audience: maintenance-quality }
        annotations:
          summary: >-
            L’imprimante utilise un lot de {{ $labels.consumable_type }}
            expiré depuis {{ printf "%.0f" $values.B.Value }} jours
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                ink = from(bucket: "printer_monitoring")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "printer_telemetry" and r._field == "ink_days_to_expiry")
                  |> group(columns: ["printer_id"])
                  |> last()
                  |> filter(fn: (r) => r._value < 0.0)
                  |> map(fn: (r) => ({r with _value: -r._value}))
                  |> set(key: "consumable_type", value: "Encre")
                solvent = from(bucket: "printer_monitoring")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "printer_telemetry" and r._field == "solvent_days_to_expiry")
                  |> group(columns: ["printer_id"])
                  |> last()
                  |> filter(fn: (r) => r._value < 0.0)
                  |> map(fn: (r) => ({r with _value: -r._value}))
                  |> set(key: "consumable_type", value: "Solvant")
                union(tables: [ink, solvent])
                  |> group(columns: ["printer_id", "consumable_type"])
                  |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value")
              datasource: { type: influxdb, uid: influxdb }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [-1] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

  - orgId: 1
    name: production
    folder: Imprimante
    interval: 1m
    rules:
      - uid: printer-downtime-influx
        title: Imprimante arrêtée malgré une demande d’impression
        condition: C
        for: 2m
        noDataState: OK
        execErrState: Error
        labels: { severity: critical, audience: operators }
        annotations:
          summary: L’imprimante ne fonctionne pas alors que la ligne demande des impressions
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                from(bucket: "printer_monitoring")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "printer_telemetry" and r._field == "printer_state_code")
                  |> group(columns: ["printer_id"])
                  |> last()
                  |> map(fn: (r) => ({r with _value: if r.classification == "downtime" then 1.0 else 0.0}))
                  |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value")
              datasource: { type: influxdb, uid: influxdb }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: viscosity-drift-influx
        title: Viscosité de l’encre hors plage
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        labels: { severity: warning, audience: maintenance }
        annotations:
          summary: >-
            L’écart de viscosité est de {{ printf "%.2f" $values.B.Value }}
            par rapport à la consigne
        data:
          - refId: A
            relativeTimeRange: { from: 900, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                import "math"
                from(bucket: "printer_monitoring")
                  |> range(start: -15m)
                  |> filter(fn: (r) => r._measurement == "printer_telemetry" and r._field == "ink_viscosity")
                  |> group(columns: ["printer_id"])
                  |> last()
                  |> map(fn: (r) => ({r with _value: math.abs(x: r._value - 4.2)}))
                  |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value")
              datasource: { type: influxdb, uid: influxdb }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [0.3] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query

      - uid: node-offline-influx
        title: Aucune donnée de l’imprimante
        condition: C
        for: 2m
        noDataState: Alerting
        execErrState: Error
        labels: { severity: critical, audience: engineering }
        annotations:
          summary: Aucune télémétrie depuis {{ printf "%.0f" $values.B.Value }} secondes
        data:
          - refId: A
            relativeTimeRange: { from: 3600, to: 0 }
            datasourceUid: influxdb
            model:
              refId: A
              query: |
                from(bucket: "printer_monitoring")
                  |> range(start: -1h)
                  |> filter(fn: (r) => r._measurement == "printer_telemetry" and r._field == "printer_state_code")
                  |> group(columns: ["printer_id"])
                  |> last()
                  |> map(fn: (r) => ({r with _value: float(v: int(v: now()) - int(v: r._time)) / 1000000000.0}))
                  |> pivot(rowKey: ["_time"], columnKey: ["_field"], valueColumn: "_value")
              datasource: { type: influxdb, uid: influxdb }
          - refId: B
            datasourceUid: __expr__
            model:
              refId: B
              type: reduce
              expression: A
              reducer: last
              settings: { mode: dropNN }
              datasource: { type: __expr__, uid: __expr__ }
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: B
              datasource: { type: __expr__, uid: __expr__ }
              conditions:
                - evaluator: { type: gt, params: [120] }
                  operator: { type: and }
                  query: { params: [B] }
                  reducer: { type: last, params: [] }
                  type: query
