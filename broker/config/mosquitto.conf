# Mosquitto — DEVELOPMENT configuration
#
# WARNING: anonymous access is enabled below. This is acceptable ONLY because
# docker-compose.yml binds the broker to 127.0.0.1, so nothing outside this
# machine can reach it. If you ever change that port binding to 0.0.0.0, you
# must switch to mosquitto.conf.production.example FIRST.
#
# The production profile must enable TLS, per-client credentials and ACLs.

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
connection_messages true

# MQTT
listener 1883
protocol mqtt
allow_anonymous true

# WebSockets — useful for browser-based MQTT debugging (MQTT Explorer, etc.)
listener 9001
protocol websockets
allow_anonymous true

# Retain the last value per topic so a restarting consumer sees current state
# instead of waiting for the next sample.
max_queued_messages 10000
message_size_limit 1048576
